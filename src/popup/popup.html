<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>RSI Overlay Settings</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>RSI Overlay</h1>

    <label class="row">
      <span>Enabled</span>
      <input type="checkbox" id="enabled" />
    </label>

    <label class="row">
      <span>Symbol</span>
      <input type="text" id="symbol" maxlength="10" />
    </label>

    <label class="row">
      <span>Oversold below</span>
      <input type="number" id="oversold" min="0" max="100" />
    </label>

    <label class="row">
      <span>Overbought above</span>
      <input type="number" id="overbought" min="0" max="100" />
    </label>

    <div id="status" class="status"></div>

    <button id="save">Save</button>

    <div id="current" class="current"></div>

    <script src="popup.js"></script>
  </body>
</html>
